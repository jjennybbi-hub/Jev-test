[project]
name = "jev-eval"
version = "0.1.0"
description = "Score LLM responses on tone and clarity with TypeSafe's Jev"
requires-python = ">=3.11"
dependencies = ["typesafe-sdk>=0.7.5"]

[project.scripts]
jev-eval = "jev_eval.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jev_eval"]
